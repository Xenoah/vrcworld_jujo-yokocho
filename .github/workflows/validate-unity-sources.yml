name: Validate Unity source contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install source-test dependencies
        run: python -m pip install -r Tests/requirements-runtime-tests.txt Pillow==12.3.0 fonttools==4.61.1
      - name: Validate source and runtime models
        run: python -X utf8 -m unittest Tests.test_runtime_models Tests.test_runtime_source Tests.test_installer_source Tests.test_integrated_preview -v
      # These checks do not replace Unity/Udon compilation, scene audits,
      # light baking, ClientSim or VRChat runtime verification.
